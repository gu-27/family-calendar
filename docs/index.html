<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Correia Family · 2026–27</title>
  <style>
    :root {
      --navy: #0F172A;
      --red: #C8102E;
      --bg: #F1F5F9;
      --border: #E2E8F0;
      --muted: #64748B;
      --free-bg: #F0FDF4;
      --free-border: #86EFAC;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
      background: var(--bg);
      color: var(--navy);
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background: var(--navy);
      padding: .9rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: .75rem;
      position: sticky;
      top: 0;
      z-index: 50;
      box-shadow: 0 2px 12px rgba(0,0,0,.25);
    }
    .sync-btn {
      background: rgba(255,255,255,.12); border: 1px solid rgba(255,255,255,.25);
      color: #fff; border-radius: 8px; padding: .35rem .75rem;
      font-size: .78rem; font-weight: 600; cursor: pointer;
      display: flex; align-items: center; gap: .35rem; transition: background .2s;
    }
    .sync-btn:hover { background: rgba(255,255,255,.22); }
    .sync-btn.syncing .sync-icon { display: inline-block; animation: spin .7s linear infinite; }
    .sync-dot { width: 7px; height: 7px; border-radius: 50%; background: #4ade80; display: none; }
    .sync-dot.stale { background: #fbbf24; display: inline-block; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .toast {
      position: fixed; bottom: 1.25rem; left: 50%; transform: translateX(-50%);
      background: #0F172A; color: #fff; padding: .55rem 1.25rem;
      border-radius: 99px; font-size: .82rem; z-index: 1000;
      opacity: 0; transition: opacity .3s; pointer-events: none; white-space: nowrap;
    }
    .toast.show { opacity: 1; }

    .header-brand {
      display: flex;
      align-items: center;
      gap: .75rem;
    }

    .header-icon {
      width: 34px; height: 34px;
      background: var(--red);
      border-radius: 9px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1rem;
    }

    .header-title {
      font-size: .95rem;
      font-weight: 800;
      color: white;
      line-height: 1.2;
    }

    .header-sub {
      font-size: .68rem;
      color: rgba(255,255,255,.4);
      letter-spacing: .06em;
      text-transform: uppercase;
    }

    .view-toggle {
      display: flex;
      gap: .35rem;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .view-btn {
      padding: .38rem .85rem;
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,.18);
      background: transparent;
      color: rgba(255,255,255,.6);
      font-size: .76rem;
      font-weight: 600;
      cursor: pointer;
      transition: all .15s;
      white-space: nowrap;
    }

    .view-btn.active {
      background: white;
      color: var(--navy);
      border-color: white;
    }

    /* ── Shared layout ── */
    .view-wrap {
      max-width: 1160px;
      margin: 1.5rem auto;
      padding: 0 1rem;
    }

    /* ── Shared month header inside a cal block ── */
    .month-heading {
      font-size: 1.3rem;
      font-weight: 800;
      color: var(--navy);
      margin-bottom: .85rem;
      display: flex;
      align-items: baseline;
      gap: .45rem;
    }

    .month-heading span {
      font-size: .75rem;
      font-weight: 500;
      color: var(--muted);
    }

    /* ── Calendar grid (full size) ── */
    .cal-grid {
      background: white;
      border-radius: 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,.07), 0 4px 16px rgba(0,0,0,.04);
      overflow: hidden;
    }

    .cal-dow-row {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      background: #F8FAFC;
      border-bottom: 1px solid var(--border);
    }

    .cal-dow {
      padding: .6rem 0;
      text-align: center;
      font-size: .66rem;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .cal-dow.is-weekend { color: var(--red); }

    .cal-days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
    }

    .cal-day {
      min-height: 110px;
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      padding: .45rem .38rem .38rem;
      cursor: pointer;
      transition: background .1s;
      position: relative;
    }

    .cal-day:nth-child(7n) { border-right: none; }
    .cal-day:not(.other-month) { background: #DCFCE7; }
    .cal-day:not(.other-month):hover { background: #BBF7D0; }
    .cal-day.has-events { background: #FFE4E8; }
    .cal-day.has-events:hover { background: #FECDD3; }
    .cal-day.tentative { background: #FEF9C3; }
    .cal-day.tentative:hover { background: #FEF08A; }
    .cal-day.other-month { background: #FAFAFA; cursor: default; }
    .cal-day.other-month .day-num { color: #CBD5E1; }

    .cal-day.is-today .day-num {
      background: var(--navy);
      color: white !important;
      border-radius: 50%;
    }

    .day-num {
      width: 26px; height: 26px;
      display: flex; align-items: center; justify-content: center;
      font-size: .78rem;
      font-weight: 700;
      color: var(--navy);
      margin-bottom: .28rem;
    }

    .event-pill {
      display: block;
      font-size: .65rem;
      font-weight: 600;
      padding: .15rem .4rem;
      border-radius: 4px;
      margin-bottom: .15rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      cursor: pointer;
      line-height: 1.4;
    }

    .event-pill:hover { opacity: .8; }
    .event-pill.cont-l  { border-radius: 0 4px 4px 0; margin-left:-4px; padding-left:6px; }
    .event-pill.cont-r  { border-radius: 4px 0 0 4px; margin-right:-4px; padding-right:6px; }
    .event-pill.cont-lr { border-radius: 0; margin-left:-4px; margin-right:-4px; padding-left:6px; padding-right:6px; }

    .more-count { font-size: .61rem; color: var(--muted); font-weight: 600; padding: 0 .35rem; }

    /* ── Continuous scroll view ── */
    .cont-wrap {
      border-radius: 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,.07), 0 4px 16px rgba(0,0,0,.04);
      overflow: hidden;
    }

    /* Single flat grid — gap creates the grid lines */
    .cont-grid {
      display: grid;
      grid-template-columns: 72px repeat(7, 1fr);
      gap: 1px;
      background: var(--border);
    }

    .cont-hdr-spacer {
      background: #F0F4F8;
    }

    .cont-dow {
      background: #F8FAFC;
      padding: .6rem 0;
      text-align: center;
      font-size: .66rem;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .cont-dow.is-weekend { color: var(--red); }

    .cont-label {
      background: #F8FAFC;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: .5rem .3rem;
    }

    .cont-label-text {
      font-size: .72rem;
      font-weight: 800;
      color: var(--navy);
      letter-spacing: .05em;
      writing-mode: vertical-rl;
      text-orientation: mixed;
      transform: rotate(180deg);
      white-space: nowrap;
    }

    .cont-day {
      min-height: 90px;
      padding: .42rem .38rem .32rem;
      cursor: pointer;
      transition: background .1s;
      background: #DCFCE7;
    }

    .cont-day:hover { background: #BBF7D0; }
    .cont-day.has-events { background: #FFE4E8; }
    .cont-day.has-events:hover { background: #FECDD3; }
    .cont-day.tentative { background: #FEF9C3; }
    .cont-day.tentative:hover { background: #FEF08A; }
    .cont-day.out-range { background: #F5F5F5; cursor: default; }
    .cont-day.out-range .cont-num { color: #C8D4E0; }
    .cont-day.is-past { background: #F1F5F9; }
    .cont-day.is-past .cont-num { color: #CBD5E1; }

    .cont-day.is-today .cont-num {
      background: var(--navy);
      color: white !important;
      border-radius: 50%;
    }

    .cont-month-marker {
      display: block;
      font-size: .55rem;
      font-weight: 800;
      color: var(--red);
      letter-spacing: .06em;
      text-transform: uppercase;
      line-height: 1;
      margin-bottom: .15rem;
    }

    .cont-num {
      width: 24px; height: 24px;
      display: flex; align-items: center; justify-content: center;
      font-size: .76rem;
      font-weight: 700;
      color: var(--navy);
      margin-bottom: .2rem;
    }

    /* ── Overview grid ── */
    .overview-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.1rem;
    }

    @media (max-width: 860px) { .overview-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 520px) { .overview-grid { grid-template-columns: 1fr; } }

    /* last item centering in 3-col when 5 items */
    .overview-grid .mini-month:nth-child(3n+1):last-child {
      grid-column: 2;
    }

    /* ── Mini calendar (overview) ── */
    .mini-month { background: white; border-radius: 14px; overflow: hidden; box-shadow: 0 1px 4px rgba(0,0,0,.07); }

    .mini-month-hdr {
      padding: .6rem .85rem .5rem;
      font-size: .82rem;
      font-weight: 800;
      color: var(--navy);
      background: #F8FAFC;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .mini-month-count {
      font-size: .65rem;
      font-weight: 700;
      color: var(--red);
      background: #FFF1F2;
      padding: .18rem .5rem;
      border-radius: 100px;
    }

    .mini-dow-row {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      background: #FAFAFA;
      border-bottom: 1px solid var(--border);
    }

    .mini-dow {
      padding: .3rem 0;
      text-align: center;
      font-size: .56rem;
      font-weight: 700;
      letter-spacing: .06em;
      text-transform: uppercase;
      color: var(--muted);
    }

    .mini-dow.is-wknd { color: var(--red); }

    .mini-days {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
    }

    .mini-day {
      min-height: 42px;
      border-right: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      padding: .28rem .2rem .2rem;
      cursor: pointer;
      transition: background .1s;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .mini-day:nth-child(7n) { border-right: none; }
    .mini-day:not(.other-month) { background: #DCFCE7; }
    .mini-day:not(.other-month):hover { background: #BBF7D0; }
    .mini-day.has-events { background: #FFE4E8; }
    .mini-day.has-events:hover { background: #FECDD3; }
    .mini-day.tentative { background: #FEF9C3; }
    .mini-day.tentative:hover { background: #FEF08A; }
    .mini-day.other-month { background: #FAFAFA; cursor: default; }
    .mini-day.other-month .mini-num { color: #CBD5E1; }

    .mini-day.is-today .mini-num {
      background: var(--navy);
      color: white !important;
      border-radius: 50%;
    }

    .mini-num {
      width: 20px; height: 20px;
      display: flex; align-items: center; justify-content: center;
      font-size: .66rem;
      font-weight: 700;
      color: var(--navy);
      margin-bottom: .18rem;
      flex-shrink: 0;
    }

    .dot-row {
      display: flex;
      gap: 2px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .ev-dot {
      width: 5px; height: 5px;
      border-radius: 50%;
      flex-shrink: 0;
    }

    /* ── Legend ── */
    .cal-legend {
      display: flex;
      flex-wrap: wrap;
      gap: .75rem 1.4rem;
      padding: .8rem 1.1rem;
      border-top: 1px solid var(--border);
      background: #FAFBFC;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: .38rem;
      font-size: .7rem;
      color: var(--muted);
      font-weight: 500;
    }

    .legend-chip {
      width: 24px; height: 8px;
      border-radius: 3px;
    }

    .legend-chip.free { background: var(--free-bg); border: 1px solid var(--free-border); }

    /* ── FAB ── */
    .fab {
      position: fixed;
      bottom: 1.75rem; right: 1.75rem;
      width: 52px; height: 52px;
      border-radius: 50%;
      background: var(--red);
      color: white;
      font-size: 1.55rem;
      line-height: 1;
      border: none;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(200,16,46,.45);
      display: flex; align-items: center; justify-content: center;
      transition: transform .15s, box-shadow .15s;
      z-index: 99;
    }

    .fab:hover { transform: scale(1.07); box-shadow: 0 6px 20px rgba(200,16,46,.55); }

    /* ── Modal ── */
    .overlay {
      position: fixed; inset: 0;
      background: rgba(15,23,42,.55);
      display: flex; align-items: center; justify-content: center;
      z-index: 200;
      padding: 1rem;
      backdrop-filter: blur(2px);
    }

    /* ── Zoom toolbar ── */
    .zoom-bar {
      display: flex;
      align-items: center;
      gap: .75rem;
      padding: .6rem 1rem;
      background: white;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 54px;
      z-index: 40;
    }

    .zoom-bar label {
      font-size: .72rem;
      font-weight: 700;
      color: var(--muted);
      white-space: nowrap;
    }

    .zoom-slider {
      flex: 1;
      max-width: 220px;
      accent-color: var(--navy);
      cursor: pointer;
    }

    .zoom-hint {
      font-size: .68rem;
      color: var(--muted);
    }

    .overlay.hidden { display: none; }

    .modal {
      background: white;
      border-radius: 18px;
      width: 100%; max-width: 455px;
      padding: 1.65rem;
      box-shadow: 0 24px 64px rgba(0,0,0,.22);
    }

    .modal-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 1.3rem;
    }

    .modal-title { font-size: 1.05rem; font-weight: 800; color: var(--navy); }

    .modal-close {
      width: 28px; height: 28px;
      border-radius: 8px; border: none;
      background: #F1F5F9; color: var(--muted);
      font-size: .95rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }

    .form-group { margin-bottom: .95rem; }

    .form-label {
      display: block;
      font-size: .67rem;
      font-weight: 700;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: .38rem;
    }

    .form-input, .form-select, .form-textarea {
      width: 100%;
      padding: .58rem .78rem;
      border: 1.5px solid var(--border);
      border-radius: 9px;
      font-size: .88rem;
      color: var(--navy);
      outline: none;
      font-family: inherit;
      background: white;
      transition: border-color .15s;
    }

    .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: #94A3B8; }

    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: .7rem; }

    .form-textarea { resize: vertical; min-height: 65px; }

    .type-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: .35rem; }

    .type-chip {
      padding: .42rem .25rem;
      border-radius: 8px;
      border: 1.5px solid var(--border);
      font-size: .63rem;
      font-weight: 700;
      text-align: center;
      cursor: pointer;
      transition: all .12s;
      color: var(--muted);
      background: white;
      line-height: 1.5;
    }

    .modal-actions {
      display: flex; gap: .55rem;
      margin-top: 1.35rem; align-items: center;
    }

    .btn-save {
      flex: 1; padding: .62rem;
      background: var(--navy); color: white;
      border: none; border-radius: 9px;
      font-size: .85rem; font-weight: 700; cursor: pointer;
    }

    .btn-save:hover { background: #1E293B; }

    .btn-cancel {
      padding: .62rem 1rem;
      background: #F1F5F9; color: var(--navy);
      border: none; border-radius: 9px;
      font-size: .84rem; font-weight: 600; cursor: pointer;
    }

    .btn-delete {
      padding: .62rem .8rem;
      background: #FEF2F2; color: #DC2626;
      border: none; border-radius: 9px;
      font-size: .8rem; font-weight: 600; cursor: pointer;
      margin-right: auto;
    }

    /* ── Summary view ── */
    .sum-card {
      background: white; border-radius: 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,.07);
      margin-bottom: 1.2rem; overflow: hidden;
    }

    .sum-card-hdr {
      padding: .95rem 1.35rem;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
    }

    .sum-card-title {
      font-size: .68rem; font-weight: 700;
      letter-spacing: .13em; text-transform: uppercase; color: var(--muted);
    }

    .sum-card-count {
      font-size: .7rem; font-weight: 700; color: var(--navy);
      background: #F1F5F9; padding: .18rem .52rem; border-radius: 100px;
    }

    .sum-row {
      display: flex; align-items: flex-start; gap: .85rem;
      padding: .82rem 1.35rem;
      border-bottom: 1px solid #F8FAFC;
      cursor: pointer; transition: background .1s;
    }

    .sum-row:last-child { border-bottom: none; }
    .sum-row:hover { background: #FAFAFA; }

    .sum-dot { width: 9px; height: 9px; border-radius: 3px; flex-shrink: 0; margin-top: .28rem; }
    .sum-row-title { font-weight: 600; font-size: .87rem; color: var(--navy); }
    .sum-row-meta { font-size: .74rem; color: var(--muted); margin-top: .12rem; }
    .sum-empty { padding: 1.4rem; text-align: center; color: var(--muted); font-size: .85rem; }

    .streak-row {
      display: flex; align-items: center; gap: .85rem;
      padding: .78rem 1.35rem;
      border-bottom: 1px solid #F8FAFC;
    }

    .streak-row:last-child { border-bottom: none; }

    .streak-pill {
      font-size: .68rem; font-weight: 700;
      padding: .22rem .6rem; border-radius: 100px; white-space: nowrap; flex-shrink: 0;
    }

    .streak-pill.free    { background: #DCFCE7; color: #166534; }
    .streak-pill.weekend { background: #EEF2FF; color: #3730A3; }
    .streak-text { font-size: .84rem; color: var(--navy); font-weight: 500; }

    /* ── Weekly Schedule view ── */
    .wk-card {
      background: white; border-radius: 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,.07), 0 4px 16px rgba(0,0,0,.04);
      margin-bottom: 1.2rem; overflow: hidden;
    }

    .wk-hdr {
      padding: 1rem 1.35rem .85rem;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: baseline; justify-content: space-between;
      gap: .6rem; flex-wrap: wrap;
    }

    .wk-title { font-size: 1.05rem; font-weight: 800; color: var(--navy); }
    .wk-sub   { font-size: .73rem; color: var(--muted); }

    .wk-legend {
      display: flex; flex-wrap: wrap; gap: .55rem 1.2rem;
      padding: .7rem 1.35rem; background: #FAFBFC;
      border-bottom: 1px solid var(--border);
    }

    .wk-legend-item { display: flex; align-items: center; gap: .42rem; font-size: .75rem; color: var(--navy); }
    .wk-legend-name { font-weight: 700; }
    .wk-legend-sub  { color: var(--muted); font-weight: 500; font-size: .72rem; }
    .wk-swatch { width: 13px; height: 13px; border-radius: 4px; flex-shrink: 0; }

    /* Legend chips double as the person filter */
    .wk-toggle {
      display: flex; align-items: center; gap: .42rem;
      font-size: .75rem; color: var(--navy); font-family: inherit;
      background: white; border: 1.5px solid var(--border);
      border-radius: 100px; padding: .3rem .7rem .3rem .55rem;
      cursor: pointer; transition: border-color .12s, background .12s, opacity .12s;
    }

    .wk-toggle:hover { border-color: #94A3B8; }

    /* Off state is carried by the hollow swatch + struck name, not by color alone */
    .wk-toggle.is-off { background: #F8FAFC; opacity: .72; }
    .wk-toggle.is-off .wk-legend-name { color: var(--muted); text-decoration: line-through; }
    .wk-toggle.is-off .wk-legend-sub  { text-decoration: line-through; }

    .wk-showall {
      font-size: .72rem; font-weight: 700; font-family: inherit;
      color: var(--navy); background: none; border: none;
      cursor: pointer; text-decoration: underline; padding: .3rem .2rem;
    }

    /* Grid */
    .wk-scroll { overflow-x: auto; }
    .wk-grid   { min-width: 820px; --wk-h: 620px; padding-bottom: 11px; } /* room for the 9:00 tick */

    .wk-row { display: grid; grid-template-columns: 62px repeat(5, 1fr); }

    .wk-corner {
      background: #F8FAFC; border-bottom: 1px solid var(--border);
      display: flex; align-items: flex-end; justify-content: flex-end;
      padding: 0 .5rem .5rem 0;
      font-size: .6rem; font-weight: 700; letter-spacing: .08em; color: var(--muted);
    }

    .wk-dayhead {
      background: #F8FAFC;
      border-left: 1px solid var(--border);
      border-bottom: 1px solid var(--border);
      padding: .55rem .45rem .5rem; text-align: center;
    }

    .wk-dayhead.is-hot { background: #FBEFEF; }
    .wk-dayname { font-size: .8rem; font-weight: 800; color: var(--navy); }

    .wk-load {
      display: inline-flex; align-items: center; gap: .3rem;
      margin-top: .3rem; padding: .15rem .5rem;
      border-radius: 100px; font-size: .59rem; font-weight: 800;
      letter-spacing: .06em; text-transform: uppercase; white-space: nowrap;
    }

    .wk-load-dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
    .wk-daystat  { font-size: .62rem; color: var(--muted); margin-top: .26rem; line-height: 1.35; }

    .wk-axis { position: relative; height: var(--wk-h); }

    .wk-tick {
      position: absolute; right: .5rem; transform: translateY(-50%);
      font-size: .63rem; color: #898781; font-variant-numeric: tabular-nums; white-space: nowrap;
    }

    .wk-lane {
      position: relative; height: var(--wk-h);
      border-left: 1px solid var(--border);
    }

    .wk-lane.is-hot { background: #FDF6F6; }

    .wk-line { position: absolute; left: 0; right: 0; height: 1px; background: #F1F3F6; pointer-events: none; }
    .wk-line.is-hour { background: #E4E7EC; }

    .wk-free {
      position: absolute; inset: 0;
      display: flex; align-items: center; justify-content: center;
      font-size: .72rem; font-weight: 700; color: #86A98B; letter-spacing: .04em;
    }

    .wk-ev {
      position: absolute;
      border-radius: 7px; border-left: 3px solid;
      padding: .28rem .38rem;
      font-size: .7rem; line-height: 1.25;
      overflow: hidden;
    }

    .wk-grid.is-tight .wk-ev { font-size: .655rem; padding: .24rem .3rem; }

    /* Names/activities ellipsis rather than crop in a narrow lane —
       the full text stays in the hover tooltip and the Full list table. */
    .wk-ev-who, .wk-ev-what { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .wk-ev-who  { font-weight: 800; }
    .wk-ev-what { font-weight: 600; }
    .wk-ev-time { font-size: .62rem; opacity: .78; font-variant-numeric: tabular-nums; margin-top: .1rem; }

    .wk-ev.is-clash { outline: 2px solid #d03b3b; outline-offset: -2px; }

    /* Unavailable, not an activity — hatched, quieter, italic label.
       Capped so a lone busy block never fills an otherwise-free day. */
    .wk-ev.is-busy { border-left-style: dotted; border-left-width: 4px; max-width: 104px; }
    .wk-ev.is-busy .wk-ev-what { font-style: italic; font-weight: 700; letter-spacing: .03em; }

    /* Insights */
    .wk-insight {
      display: flex; align-items: flex-start; gap: .8rem;
      padding: .8rem 1.35rem; border-bottom: 1px solid #F4F6F8;
    }

    .wk-insight:last-child { border-bottom: none; }
    .wk-insight-day { font-size: .84rem; font-weight: 800; color: var(--navy); width: 82px; flex-shrink: 0; }
    .wk-insight-body { flex: 1; }

    .wk-chips { display: flex; flex-wrap: wrap; gap: .3rem; margin-top: .3rem; }

    .wk-chip {
      font-size: .68rem; font-weight: 600; color: #475569;
      background: #F1F5F9; border-radius: 100px; padding: .16rem .55rem;
    }

    .wk-chip.is-alert { background: #FBEAEA; color: #8E2020; font-weight: 700; }

    /* Table view */
    .wk-table { width: 100%; border-collapse: collapse; font-size: .8rem; }
    .wk-table th {
      text-align: left; padding: .5rem 1.35rem; background: #F8FAFC;
      font-size: .62rem; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted);
      border-bottom: 1px solid var(--border);
    }
    .wk-table td { padding: .5rem 1.35rem; border-bottom: 1px solid #F4F6F8; color: var(--navy); }
    .wk-table tr:last-child td { border-bottom: none; }
    .wk-table td.wk-td-time { font-variant-numeric: tabular-nums; color: var(--muted); white-space: nowrap; }
    .wk-table tbody tr.is-daystart td { border-top: 1px solid var(--border); }
    .wk-who-cell { display: flex; align-items: center; gap: .42rem; font-weight: 700; }

    /* ── Responsive ── */
    @media (max-width: 600px) {
      .cal-day { min-height: 72px; }
      .type-grid { grid-template-columns: repeat(3, 1fr); }
      .wk-grid { --wk-h: 520px; }
      .wk-insight-day { width: 100%; }
      .wk-insight { flex-direction: column; gap: .3rem; }
    }
  </style>
</head>
<body>

<script>
// ── Constants ────────────────────────────────────────────
// The calendar runs the 2026–27 school year, which crosses a year boundary —
// so months are carried as {y,m} pairs, never a bare month index.
const TERM = { startY: 2026, startM: 7, endY: 2027, endM: 5 }; // Aug 2026 – Jun 2027
const TERM_START = '2026-08-01';
const TERM_END   = '2027-06-30';

const TERM_MONTHS = (() => {
  const out = [];
  let y = TERM.startY, m = TERM.startM;
  while (y < TERM.endY || (y === TERM.endY && m <= TERM.endM)) {
    out.push({ y, m });
    if (++m > 11) { m = 0; y++; }
  }
  return out;
})();

function inTerm(str) { return str >= TERM_START && str <= TERM_END; }

const MONTH_NAMES  = ['January','February','March','April','May','June','July','August','September','October','November','December'];
const DOW_LABELS   = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
const STORAGE_KEY  = 'family-cal-2026';

const TYPES = {
  game:       { label:'Game',         emoji:'🏆',  color:'#DC2626', bg:'#FEF2F2', text:'#991B1B' },
  practice:   { label:'Practice',     emoji:'🏃',  color:'#0EA5E9', bg:'#F0F9FF', text:'#075985' },
  travel:     { label:'Travel',       emoji:'✈️',  color:'#F97316', bg:'#FFF7ED', text:'#9A3412' },
  commitment: { label:'Commitment',   emoji:'📌',  color:'#6366F1', bg:'#EEF2FF', text:'#3730A3' },
  family:     { label:'Family',       emoji:'👨‍👩‍👧‍👦', color:'#EC4899', bg:'#FDF2F8', text:'#9D174D' },
  holiday:    { label:'Holiday',      emoji:'🎉',  color:'#10B981', bg:'#ECFDF5', text:'#065F46' },
  other:      { label:'Other',        emoji:'📎',  color:'#94A3B8', bg:'#F8FAFC', text:'#475569' },
};

// ── GitHub Sync ──────────────────────────────────────────
const GH = {
  owner: 'gu-27', repo: 'family-summer-2026-calendar',
  branch: 'main', path: 'docs/calendar-data.json',
};
let ghSHA = '';

// No token is stored in this file. This repo is PUBLIC — a token committed here
// gets found by GitHub's secret scanning and revoked, which is exactly how the
// previous one died ("Bad credentials"). The token now lives only in the
// browser's localStorage, per device, and is only needed to SAVE. Reading the
// calendar works for everyone with no token at all.
function getToken() { return localStorage.getItem('cal_token') || ''; }

function setToken(t) {
  if (t) localStorage.setItem('cal_token', t);
  else localStorage.removeItem('cal_token');
}

async function tokenWorks(t) {
  try {
    const res = await fetch(`https://api.github.com/repos/${GH.owner}/${GH.repo}`,
      { headers: { Authorization: `token ${t}` } });
    return res.ok;
  } catch (e) { return false; }
}

// Ask for a token in the page itself — no browser console needed.
async function promptForToken() {
  const t = (window.prompt(
    'Paste a GitHub token so this device can save changes.\n\n' +
    'Make one at github.com/settings/personal-access-tokens\n' +
    '  · Fine-grained token\n' +
    '  · Repository access: only family-summer-2026-calendar\n' +
    '  · Repository permissions -> Contents: Read and write\n\n' +
    'It is saved only in this browser, never in the site.'
  ) || '').trim();
  if (!t) return false;
  showToast('Checking token…');
  if (!(await tokenWorks(t))) {
    showToast('That token did not work — needs Contents: Read and write');
    return false;
  }
  setToken(t);
  showToast('Token saved on this device ✓');
  return true;
}

function encB64(str) {
  const b = new TextEncoder().encode(str); let s = '';
  b.forEach(x => s += String.fromCharCode(x)); return btoa(s);
}
function decB64(b64) {
  const b = atob(b64); const a = Uint8Array.from(b, c => c.charCodeAt(0));
  return new TextDecoder().decode(a);
}

async function ghLoad() {
  // Public repo: reading needs no token, so the calendar still shows up for
  // family members who have never set one.
  const token = getToken();
  const url = `https://api.github.com/repos/${GH.owner}/${GH.repo}/contents/${GH.path}`;
  const headers = { 'Cache-Control': 'no-cache' };
  if (token) headers.Authorization = `token ${token}`;
  const res = await fetch(url, { headers });
  if (!res.ok) return null;
  const data = await res.json();
  ghSHA = data.sha;
  return JSON.parse(decB64(data.content.replace(/\n/g, '')));
}

async function syncToGitHub() {
  let token = getToken();
  if (!token) {
    if (!(await promptForToken())) return;
    token = getToken();
  }
  if (!initDone) { showToast('Still loading — try again in a moment'); return; }
  const btn = document.getElementById('sync-btn');
  btn.classList.add('syncing');
  try {
    // Always fetch GitHub first, then merge — never blindly overwrite
    const url = `https://api.github.com/repos/${GH.owner}/${GH.repo}/contents/${GH.path}`;
    const getRes = await fetch(url, { headers: { Authorization: `token ${token}` } });
    // An expired or revoked token should say so plainly, and clear itself, so the
    // next Sync offers the paste box instead of failing the same way forever.
    if (getRes.status === 401 || getRes.status === 403) {
      setToken('');
      btn.classList.remove('syncing');
      setSyncDot(false);
      showToast('Token expired — tap Sync again to paste a new one');
      return;
    }
    if (getRes.ok) {
      const d = await getRes.json();
      ghSHA = d.sha;
      // Merge: union of local + GitHub by id (local changes win for same id)
      const ghEvents = JSON.parse(decB64(d.content.replace(/\n/g, '')));
      const merged = [...ghEvents];
      for (const ev of events) {
        const idx = merged.findIndex(e => e.id === ev.id);
        if (idx >= 0) merged[idx] = ev; // local wins on conflict
        else merged.push(ev);           // new local event
      }
      events = merged;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(events));
      refresh();
    }
    const content = encB64(JSON.stringify(events, null, 2));
    const putRes = await fetch(url, {
      method: 'PUT',
      headers: { Authorization: `token ${token}`, 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: 'Update calendar-data.json', content, sha: ghSHA, branch: GH.branch })
    });
    if (!putRes.ok) { const e = await putRes.json().catch(() => ({})); throw new Error(e.message || putRes.status); }
    const result = await putRes.json(); ghSHA = result.content.sha;
    localStorage.setItem('cal_lastsync', new Date().toISOString());
    setSyncDot(true); showToast('Synced ✓');
  } catch(e) { showToast('Sync failed: ' + e.message); }
  btn.classList.remove('syncing');
}

function setSyncDot(synced) {
  const d = document.getElementById('sync-dot');
  if (d) d.classList.toggle('stale', !synced);
}

let toastTimer;
function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.classList.remove('show'), 3000);
}

// ── State ────────────────────────────────────────────────
let events = load();
let view = 'scroll';
let editingId = null;
let selectedType = 'travel';
let initDone = false; // guard: don't auto-sync until GitHub load completes

function load() {
  try { const r = localStorage.getItem(STORAGE_KEY); if (r) return JSON.parse(r); } catch(e) {}
  return [];
}

function persist() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(events));
  setSyncDot(false);
  // Auto-sync on every save (but not during startup before GitHub load completes)
  if (initDone && getToken()) syncToGitHub();
}

// ── Date helpers ─────────────────────────────────────────
function ds(y,m,d) { return `${y}-${String(m+1).padStart(2,'0')}-${String(d).padStart(2,'0')}`; }
function parseDs(s) { const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function todayStr() { const t=new Date(); return ds(t.getFullYear(),t.getMonth(),t.getDate()); }
function daysInMonth(y,m) { return new Date(y,m+1,0).getDate(); }
function startDow(y,m) { return new Date(y,m,1).getDay(); }
function fmtDate(s) { return parseDs(s).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}); }
function fmtRange(s,e) {
  if (s===e) return fmtDate(s);
  const sd=parseDs(s),ed=parseDs(e);
  if (sd.getMonth()===ed.getMonth()&&sd.getFullYear()===ed.getFullYear())
    return `${sd.toLocaleDateString('en-US',{month:'short',day:'numeric'})}–${ed.getDate()}, ${ed.getFullYear()}`;
  return `${fmtDate(s)} – ${fmtDate(e)}`;
}
function dayCount(s,e) { return Math.round((parseDs(e)-parseDs(s))/86400000)+1; }
function eventsOnDay(str) { return events.filter(e=>e.start<=str&&e.end>=str); }
function uid() { return 'ev-'+Date.now()+'-'+Math.random().toString(36).slice(2,7); }

// "17:30" -> "5:30" — shown as a prefix on pills so a game reads as a time first
function evTime(ev) {
  if (!ev || !ev.time) return '';
  const [h, mi] = ev.time.split(':').map(Number);
  return `${((h + 11) % 12) + 1}:${String(mi).padStart(2, '0')} `;
}
function evWho(ev) {
  return ev && ev.who && typeof PEOPLE !== 'undefined' && PEOPLE[ev.who] ? PEOPLE[ev.who].name : '';
}

// ── Legend HTML ──────────────────────────────────────────
const LEGEND_HTML = `
  <div class="cal-legend">
    <div class="legend-item"><div class="legend-chip" style="background:#FECACA"></div>Game</div>
    <div class="legend-item"><div class="legend-chip" style="background:#BAE6FD"></div>Practice</div>
    <div class="legend-item"><div class="legend-chip" style="background:#FED7AA"></div>Travel</div>
    <div class="legend-item"><div class="legend-chip" style="background:#C7D2FE"></div>Commitment</div>
    <div class="legend-item"><div class="legend-chip" style="background:#FBCFE8"></div>Family</div>
    <div class="legend-item"><div class="legend-chip" style="background:#A7F3D0"></div>Holiday</div>
    <div class="legend-item"><div class="legend-chip" style="background:#E2E8F0"></div>Other</div>
    <div class="legend-item"><div class="legend-chip" style="background:#DCFCE7;border:1px solid #86EFAC;"></div>Available</div>
    <div class="legend-item"><div class="legend-chip" style="background:#FFE4E8;border:1px solid #FECDD3;"></div>Confirmed</div>
    <div class="legend-item"><div class="legend-chip" style="background:#FEF9C3;border:1px solid #FDE047;"></div>Tentative</div>
  </div>`;

// ── Build a full-size month grid ──────────────────────────
function buildFullMonth(y, m) {
  const today=todayStr();
  const total=daysInMonth(y,m), first=startDow(y,m);
  const prevTotal=daysInMonth(y,m-1);

  const dowHdr = DOW_LABELS.map((d,i)=>
    `<div class="cal-dow ${i===0||i===6?'is-weekend':''}">${d}</div>`).join('');

  let cells='';
  for (let i=first-1;i>=0;i--)
    cells+=`<div class="cal-day other-month"><div class="day-num">${prevTotal-i}</div></div>`;

  for (let d=1;d<=total;d++) {
    const str=ds(y,m,d), dow=new Date(y,m,d).getDay();
    const evs=eventsOnDay(str);
    const isToday=str===today, isSat=dow===6, isSun=dow===0;
    let freeWknd=false;
    if (isSat&&d+1<=total)      freeWknd=evs.length===0&&eventsOnDay(ds(y,m,d+1)).length===0;
    else if (isSun&&d>1)        freeWknd=evs.length===0&&eventsOnDay(ds(y,m,d-1)).length===0;
    else if (isSun&&d===1)      freeWknd=evs.length===0&&eventsOnDay(ds(y,m-1,daysInMonth(y,m-1))).length===0;

    const dayColor = evs.length===0 ? '' : evs.some(e=>!e.status||e.status==='booked') ? 'has-events' : 'tentative';
    const cls=['cal-day',isToday?'is-today':'',dayColor].filter(Boolean).join(' ');
    let pills='';
    evs.slice(0,2).forEach(ev=>{
      const t=TYPES[ev.type]||TYPES.other;
      const sl=ev.start===str, el=ev.end===str;
      const cc=!sl&&!el?'cont-lr':!sl?'cont-l':!el?'cont-r':'';
      pills+=`<span class="event-pill ${cc}" style="background:${t.bg};color:${t.text};border-left:2px solid ${t.color};"
        onclick="openModal('${ev.id}');event.stopPropagation();">${sl?evTime(ev)+ev.title:''}</span>`;
    });
    if (evs.length>2) pills+=`<span class="more-count">+${evs.length-2}</span>`;
    cells+=`<div class="${cls}" onclick="openModal(null,'${str}')"><div class="day-num">${d}</div>${pills}</div>`;
  }

  const used=first+total, pad=used%7===0?0:7-(used%7);
  for (let d=1;d<=pad;d++)
    cells+=`<div class="cal-day other-month"><div class="day-num">${d}</div></div>`;

  return `
    <div class="cal-grid">
      <div class="cal-dow-row">${dowHdr}</div>
      <div class="cal-days">${cells}</div>
      ${LEGEND_HTML}
    </div>`;
}

// ── Build a mini month (overview) ────────────────────────
function buildMiniMonth(y, m) {
  const today=todayStr();
  const total=daysInMonth(y,m), first=startDow(y,m);
  const prevTotal=daysInMonth(y,m-1);
  // Compare on full dates, not bare month numbers — the term spans two years,
  // so month index alone would count August 2026 events into a 2027 August.
  const mStart = ds(y, m, 1), mEnd = ds(y, m, daysInMonth(y, m));
  const evCount = events.filter(e => e.start <= mEnd && e.end >= mStart).length;

  const dowHdr=DOW_LABELS.map((d,i)=>
    `<div class="mini-dow ${i===0||i===6?'is-wknd':''}">${d[0]}</div>`).join('');

  let cells='';
  for (let i=first-1;i>=0;i--)
    cells+=`<div class="mini-day other-month"><div class="mini-num">${prevTotal-i}</div></div>`;

  for (let d=1;d<=total;d++) {
    const str=ds(y,m,d), dow=new Date(y,m,d).getDay();
    const evs=eventsOnDay(str);
    const isToday=str===today, isSat=dow===6, isSun=dow===0;
    let freeWknd=false;
    if (isSat&&d+1<=total)      freeWknd=evs.length===0&&eventsOnDay(ds(y,m,d+1)).length===0;
    else if (isSun&&d>1)        freeWknd=evs.length===0&&eventsOnDay(ds(y,m,d-1)).length===0;
    else if (isSun&&d===1)      freeWknd=evs.length===0&&eventsOnDay(ds(y,m-1,daysInMonth(y,m-1))).length===0;

    const dayColor = evs.length===0 ? '' : evs.some(e=>!e.status||e.status==='booked') ? 'has-events' : 'tentative';
    const cls=['mini-day',isToday?'is-today':'',dayColor].filter(Boolean).join(' ');
    const dots=evs.slice(0,3).map(ev=>{
      const t=TYPES[ev.type]||TYPES.other;
      return `<div class="ev-dot" style="background:${t.color}" onclick="openModal('${ev.id}');event.stopPropagation();"></div>`;
    }).join('');
    const dotRow=evs.length?`<div class="dot-row">${dots}${evs.length>3?`<div class="ev-dot" style="background:#CBD5E1"></div>`:''}</div>`:'';
    cells+=`<div class="${cls}" onclick="openModal(null,'${str}')"><div class="mini-num">${d}</div>${dotRow}</div>`;
  }

  const used=first+total, pad=used%7===0?0:7-(used%7);
  for (let d=1;d<=pad;d++)
    cells+=`<div class="mini-day other-month"><div class="mini-num">${d}</div></div>`;

  return `
    <div class="mini-month">
      <div class="mini-month-hdr">
        ${MONTH_NAMES[m]} <span style="font-weight:600;color:var(--muted);font-size:.72rem;">${y}</span>
        ${evCount>0?`<span class="mini-month-count">${evCount} event${evCount>1?'s':''}</span>`:''}
      </div>
      <div class="mini-dow-row">${dowHdr}</div>
      <div class="mini-days">${cells}</div>
    </div>`;
}

// ── Render views ─────────────────────────────────────────
function renderScroll() {
  const today = todayStr();

  // Build continuous weeks: first Sunday on/before May 1 → last Saturday on/after Sep 30
  const firstDay = parseDs(TERM_START);
  firstDay.setDate(firstDay.getDate() - firstDay.getDay());
  const lastDay = parseDs(TERM_END);
  lastDay.setDate(lastDay.getDate() + (6 - lastDay.getDay()));

  const weeks = [];
  for (let d = new Date(firstDay); d <= lastDay; ) {
    const week = [];
    for (let i = 0; i < 7; i++) { week.push(new Date(d)); d.setDate(d.getDate() + 1); }
    weeks.push(week);
  }

  // Which grid row each month label starts on (header = row 1, weeks start at row 2).
  // Months are keyed "y-m" because the term spans two calendar years.
  const monthLabeled = new Set();
  const monthStartRow = {};
  const monthOrder = [];

  weeks.forEach((week, wi) => {
    const gridRow = wi + 2;
    let label = null;

    // The first in-term week labels whatever month it belongs to.
    if (!monthLabeled.size) {
      const d0 = week.find(d => inTerm(ds(d.getFullYear(), d.getMonth(), d.getDate())));
      if (d0) label = d0.getFullYear() + '-' + d0.getMonth();
    }

    // Any later month starts when its 1st falls inside this week.
    if (label === null) {
      for (const day of week) {
        const key = day.getFullYear() + '-' + day.getMonth();
        if (day.getDate() === 1 && inTerm(ds(day.getFullYear(), day.getMonth(), 1)) && !monthLabeled.has(key)) {
          label = key;
          break;
        }
      }
    }

    if (label !== null && !monthLabeled.has(label)) {
      monthLabeled.add(label);
      monthStartRow[label] = gridRow;
      monthOrder.push(label);
    }
  });

  // Each month spans until the next month's start row (or the end of the grid)
  const totalRows = weeks.length + 1;
  const monthSpans = {};
  monthOrder.forEach((key, i) => {
    const start = monthStartRow[key];
    const end = i + 1 < monthOrder.length ? monthStartRow[monthOrder[i + 1]] : totalRows + 1;
    monthSpans[key] = { start, span: end - start };
  });

  // ── Build flat grid HTML ─────────────────────────────
  let html = '<div class="cont-grid">';

  // Header row (row 1)
  html += `<div class="cont-hdr-spacer" style="grid-column:1;grid-row:1;"></div>`;
  DOW_LABELS.forEach((d, i) => {
    html += `<div class="cont-dow ${i===0||i===6?'is-weekend':''}" style="grid-column:${i+2};grid-row:1;">${d}</div>`;
  });

  // Month label cells (spanning multiple rows). The year is shown on January so
  // the boundary between the two calendar years is readable in one column.
  monthOrder.forEach(key => {
    const { start, span } = monthSpans[key];
    const [ly, lm] = key.split('-').map(Number);
    const name = MONTH_NAMES[lm] + (lm === 0 ? ' ' + ly : '');
    html += `<div class="cont-label" style="grid-column:1;grid-row:${start}/span ${span};">
      <span class="cont-label-text">${name}</span>
    </div>`;
  });

  // Day cells — explicitly placed, no first-column cell needed
  weeks.forEach((week, wi) => {
    const gridRow = wi + 2;
    week.forEach((day, di) => {
      const gridCol = di + 2; // columns 2–8
      const str = ds(day.getFullYear(), day.getMonth(), day.getDate());
      const inRange = inTerm(str);

      if (!inRange) {
        html += `<div class="cont-day out-range" style="grid-column:${gridCol};grid-row:${gridRow};">
          <div class="cont-num">${day.getDate()}</div>
        </div>`;
        return;
      }

      const evs = eventsOnDay(str);
      const isToday = str === today;
      const isPast  = str < today;
      const showMark = day.getDate() === 1;
      const dayColor = evs.length===0 ? '' : evs.some(e=>!e.status||e.status==='booked') ? 'has-events' : 'tentative';
      const cls = ['cont-day', isToday ? 'is-today' : '', dayColor, isPast && evs.length===0 ? 'is-past' : ''].filter(Boolean).join(' ');

      let pills = '';
      evs.slice(0, 2).forEach(ev => {
        const t = TYPES[ev.type] || TYPES.other;
        const sl = ev.start === str, el = ev.end === str;
        const cc = !sl && !el ? 'cont-lr' : !sl ? 'cont-l' : !el ? 'cont-r' : '';
        const showTitle = true;
        pills += `<span class="event-pill ${cc}" style="background:${t.bg};color:${t.text};border-left:2px solid ${t.color};"
          onclick="openModal('${ev.id}');event.stopPropagation();">${showTitle ? (sl ? evTime(ev) : '') + ev.title : ''}</span>`;
      });
      if (evs.length > 2) pills += `<span class="more-count">+${evs.length - 2}</span>`;

      html += `<div class="${cls}" style="grid-column:${gridCol};grid-row:${gridRow};" onclick="openModal(null,'${str}')">
        ${showMark ? `<div class="cont-month-marker">${MONTH_NAMES[day.getMonth()].slice(0,3)}</div>` : ''}
        <div class="cont-num">${day.getDate()}</div>
        ${pills}
      </div>`;
    });
  });

  html += '</div>';
  document.getElementById('scrollView').innerHTML = `<div class="cont-wrap">${html}${LEGEND_HTML}</div>`;
}

function renderOverview() {
  const grid = TERM_MONTHS.map(t => buildMiniMonth(t.y, t.m)).join('');
  document.getElementById('overviewView').innerHTML = `
    <div class="overview-grid">${grid}</div>
    ${LEGEND_HTML.replace('cal-legend','cal-legend').replace('style="','style="margin-top:.5rem;border-radius:12px;')}`;
}

function renderSummary() {
  const sorted=[...events].sort((a,b)=>a.start.localeCompare(b.start));
  let html='';

  html+=`<div class="sum-card">
    <div class="sum-card-hdr"><div class="sum-card-title">All Events</div><div class="sum-card-count">${sorted.length}</div></div>`;
  if (!sorted.length) html+=`<div class="sum-empty">No events yet — tap ＋ to add your first.</div>`;
  else sorted.forEach(ev=>{
    const t=TYPES[ev.type]||TYPES.other, days=dayCount(ev.start,ev.end);
    html+=`<div class="sum-row" onclick="openModal('${ev.id}')">
      <div class="sum-dot" style="background:${t.color}"></div>
      <div>
        <div class="sum-row-title">${ev.title}</div>
        <div class="sum-row-meta">${fmtRange(ev.start,ev.end)}${ev.time?' · '+evTime(ev).trim():''} · ${t.label}${evWho(ev)?' · '+evWho(ev):''}${days>1?' · '+days+' days':''}${ev.notes?' · '+ev.notes:''}</div>
      </div></div>`;
  });
  html+=`</div>`;

  const stretches=calcStretches();
  html+=`<div class="sum-card">
    <div class="sum-card-hdr"><div class="sum-card-title">Longest Free Stretches</div><div class="sum-card-count">${stretches.length}</div></div>`;
  if (!stretches.length) html+=`<div class="sum-empty">No open stretches found.</div>`;
  else stretches.slice(0,8).forEach(s=>
    html+=`<div class="streak-row"><span class="streak-pill free">${s.days} day${s.days>1?'s':''}</span><span class="streak-text">${fmtRange(s.start,s.end)}</span></div>`);
  html+=`</div>`;

  const wknds=calcFreeWeekends();
  html+=`<div class="sum-card">
    <div class="sum-card-hdr"><div class="sum-card-title">Free Weekends</div><div class="sum-card-count">${wknds.length}</div></div>`;
  if (!wknds.length) html+=`<div class="sum-empty">No fully free weekends found.</div>`;
  else wknds.forEach(w=>
    html+=`<div class="streak-row"><span class="streak-pill weekend">Weekend</span><span class="streak-text">${fmtRange(w.sat,w.sun)}</span></div>`);
  html+=`</div>`;

  document.getElementById('summaryView').innerHTML=html;
}

function calcStretches() {
  const start=parseDs(TERM_START), end=parseDs(TERM_END);
  const out=[]; let ss=null, len=0;
  for (let d=new Date(start);d<=end;d.setDate(d.getDate()+1)) {
    const s=ds(d.getFullYear(),d.getMonth(),d.getDate());
    if (!eventsOnDay(s).length) { if (!ss) ss=s; len++; }
    else {
      if (len>=2&&ss) { const e2=new Date(d); e2.setDate(e2.getDate()-1); out.push({start:ss,end:ds(e2.getFullYear(),e2.getMonth(),e2.getDate()),days:len}); }
      ss=null; len=0;
    }
  }
  if (len>=2&&ss) out.push({start:ss,end:ds(end.getFullYear(),end.getMonth(),end.getDate()),days:len});
  return out.sort((a,b)=>b.days-a.days);
}

function calcFreeWeekends() {
  const out=[];
  for (let d=parseDs(TERM_START);d<=parseDs(TERM_END);d.setDate(d.getDate()+1)) {
    if (d.getDay()===6) {
      const sat=ds(d.getFullYear(),d.getMonth(),d.getDate());
      const s2=new Date(d); s2.setDate(s2.getDate()+1);
      const sun=ds(s2.getFullYear(),s2.getMonth(),s2.getDate());
      if (!eventsOnDay(sat).length&&!eventsOnDay(sun).length) out.push({sat,sun});
    }
  }
  return out;
}

// ── Weekly after-school schedule ──────────────────────────
// Edit WEEK_ACTIVITIES to change the weekly grid. Times are 24h "HH:MM".
const WK_DAYS   = ['Mon','Tue','Wed','Thu','Fri'];
const WK_FULL   = { Mon:'Monday', Tue:'Tuesday', Wed:'Wednesday', Thu:'Thursday', Fri:'Friday' };
const WK_START  = 14*60 + 30;   // 2:30 PM
const WK_END    = 21*60;        // 9:00 PM
const WK_SPAN   = WK_END - WK_START;

// Colors are fixed per person and never reassigned — filtering someone out
// must not repaint anyone else. The four hues validate all-pairs for colorblind
// separation; JC's slate is a deliberate neutral outside the categorical ramp.
const PEOPLE = {
  K:  { name:'Kalia', color:'#2a78d6', bg:'#E9F1FC', ink:'#1A4E8A' },
  ML: { name:'ML',    color:'#eb6834', bg:'#FDEDE5', ink:'#8E3A14' },
  KJ: { name:'KJ',    color:'#1baf7a', bg:'#E4F6EF', ink:'#0B5A3F' },
  CC: { name:'CC',    color:'#4a3aa7', bg:'#ECEAF7', ink:'#332876' },
  JC: { name:'JC',    color:'#52514e', bg:'#EFEEEC', ink:'#3A3936' },
};

// kind:'busy' = unavailable, not an activity. Busy blocks are drawn but do not
// count as activities and create no drop-off/pickup — change kind to 'activity'
// if the block should count as a commitment someone has to be driven to.
// `until` = last date the season runs. Dance and CC's block have no end date
// yet, so they carry none and read as ongoing.
const WEEK_ACTIVITIES = [
  { who:'K',  what:'Volleyball', days:['Mon','Tue','Wed','Thu'], start:'14:30', end:'17:30', until:'2026-10-28' },
  { who:'K',  what:'Dance',      days:['Tue','Thu'],             start:'19:00', end:'20:45' },
  { who:'ML', what:'Volleyball', days:['Mon','Wed'],             start:'15:15', end:'16:45', until:'2026-10-28' },
  { who:'ML', what:'Dance',      days:['Tue'],                   start:'16:00', end:'17:20' },
  { who:'ML', what:'Dance',      days:['Thu'],                   start:'16:00', end:'17:45' },
  { who:'ML', what:'Soccer',     days:['Tue','Thu'],             start:'17:30', end:'18:30', until:'2026-10-17' },
  { who:'KJ', what:'Soccer',     days:['Tue'],                   start:'18:30', end:'19:30', until:'2026-10-17' },
  { who:'CC', what:'Busy',       days:['Mon','Wed','Fri'],       start:'14:30', end:'15:30', kind:'busy' },
];

// "2026-10-28" -> "Oct 28"
function wkUntil(u) {
  if (!u) return '';
  return parseDs(u).toLocaleDateString('en-US', { month:'short', day:'numeric' });
}

// ── Person filter ──
const WK_HIDDEN_KEY = 'wk-hidden';
let wkHidden = new Set();
try { wkHidden = new Set(JSON.parse(localStorage.getItem(WK_HIDDEN_KEY) || '[]')); } catch(e) {}

function wkToggle(who) {
  if (wkHidden.has(who)) wkHidden.delete(who); else wkHidden.add(who);
  localStorage.setItem(WK_HIDDEN_KEY, JSON.stringify([...wkHidden]));
  renderWeekly();
}

function wkShowAll() {
  wkHidden.clear();
  localStorage.setItem(WK_HIDDEN_KEY, '[]');
  renderWeekly();
}

const WK_TIERS = {
  heaviest: { label:'Heaviest', dot:'#d03b3b', bg:'#FBEAEA', ink:'#8E2020' },
  heavy:    { label:'Heavy',    dot:'#ec835a', bg:'#FCEFE8', ink:'#8A4520' },
  moderate: { label:'Moderate', dot:'#fab219', bg:'#FDF6E3', ink:'#7A5605' },
  open:     { label:'Open',     dot:'#0ca30c', bg:'#E9F7E9', ink:'#14631A' },
};

function wkMin(s)  { const [h,m] = s.split(':').map(Number); return h*60 + m; }
function wkT(m)    { const h = Math.floor(m/60), mm = m%60; return `${((h+11)%12)+1}:${String(mm).padStart(2,'0')}`; }
function wkTA(m)   { return wkT(m) + (m < 720 ? ' AM' : ' PM'); }
function wkDur(m)  { const h = Math.floor(m/60), mm = m%60; return h ? (mm ? `${h}h ${mm}m` : `${h}h`) : `${mm}m`; }

// Expand the activity list into per-day events
function wkEvents() {
  const byDay = {};
  WK_DAYS.forEach(d => byDay[d] = []);
  WEEK_ACTIVITIES.forEach(a => {
    a.days.forEach(d => {
      if (byDay[d] && !wkHidden.has(a.who))
        byDay[d].push({ who:a.who, what:a.what, kind:a.kind || 'activity',
                        s:wkMin(a.start), e:wkMin(a.end), until:a.until || '' });
    });
  });
  WK_DAYS.forEach(d => byDay[d].sort((a,b) => a.s - b.s || b.e - a.e));
  return byDay;
}

// One lane per person present that day (fixed left→right order), sub-split when
// the same person is booked twice at once — so a real conflict reads as a split lane.
function wkLayout(evs) {
  const present = Object.keys(PEOPLE).filter(w => evs.some(v => v.who === w));
  const out = [];
  present.forEach((who, lane) => {
    const mine = evs.filter(v => v.who === who);
    const subs = [];
    mine.forEach(v => {
      let placed = false;
      for (let c = 0; c < subs.length; c++) {
        if (subs[c][subs[c].length-1].e <= v.s) { subs[c].push(v); v.sub = c; placed = true; break; }
      }
      if (!placed) { subs.push([v]); v.sub = subs.length - 1; }
    });
    mine.forEach(v => { v.lane = lane; v.lanes = present.length; v.subs = subs.length; out.push(v); });
  });
  return out;
}

// Logistics load for one day. Busy blocks mean "unavailable" — they are not a
// place anyone gets driven to, so they carry no stops and no load.
function wkMetrics(all) {
  const busy = all.filter(v => v.kind === 'busy');
  const evs  = all.filter(v => v.kind !== 'busy');
  if (!evs.length) return { count:0, score:0, stops:0, splitMin:0, maxAt:0, tight:[], clashes:[], span:0, busy };

  const stops = new Set();
  evs.forEach(v => { stops.add(v.s); stops.add(v.e); });

  // minutes with two or more running at once + peak simultaneous
  const bounds = [...stops].sort((a,b) => a - b);
  let splitMin = 0, maxAt = 0;
  for (let i = 0; i < bounds.length - 1; i++) {
    const a = bounds[i], b = bounds[i+1];
    const n = evs.filter(v => v.s < b && v.e > a).length;
    if (n > maxAt) maxAt = n;
    if (n >= 2) splitMin += b - a;
  }

  // same person booked in two places at once
  const clashes = [];
  for (let i = 0; i < evs.length; i++) for (let j = i + 1; j < evs.length; j++) {
    const a = evs[i], b = evs[j];
    if (a.who === b.who && a.s < b.e && b.s < a.e)
      clashes.push({ who:a.who, s:Math.max(a.s,b.s), e:Math.min(a.e,b.e), a, b });
  }

  // tight handoffs: 2+ drop-offs/pickups for different kids inside 15 minutes
  const pts = [];
  evs.forEach(v => {
    pts.push({ t:v.s, kind:'drop-off', who:v.who, what:v.what });
    pts.push({ t:v.e, kind:'pickup',   who:v.who, what:v.what });
  });
  pts.sort((a,b) => a.t - b.t);
  const tight = [];
  let grp = [];
  const flush = () => {
    if (grp.length >= 2 && new Set(grp.map(p => p.who)).size >= 2) tight.push(grp);
    grp = [];
  };
  pts.forEach(p => {
    if (grp.length && p.t - grp[grp.length-1].t > 15) flush();
    grp.push(p);
  });
  flush();

  const dblMin = clashes.reduce((n,c) => n + (c.e - c.s), 0);
  const first  = Math.min(...evs.map(v => v.s)), last = Math.max(...evs.map(v => v.e));
  const score  = evs.length*2 + stops.size + Math.round(splitMin/30) + tight.length*4 + (dblMin ? 8 : 0);

  return { count:evs.length, score, stops:stops.size, splitMin, maxAt, tight, clashes, dblMin, first, last, span:last-first, busy };
}

function wkTier(score, max) {
  if (!score) return WK_TIERS.open;
  if (score >= max * 0.85) return WK_TIERS.heaviest;
  if (score >= max * 0.5)  return WK_TIERS.heavy;
  return WK_TIERS.moderate;
}

function renderWeekly() {
  const byDay = wkEvents();
  const met   = {}; WK_DAYS.forEach(d => met[d] = wkMetrics(byDay[d]));
  const max   = Math.max(1, ...WK_DAYS.map(d => met[d].score));
  const tier  = {}; WK_DAYS.forEach(d => tier[d] = wkTier(met[d].score, max));
  const maxLanes = Math.max(...WK_DAYS.map(d => new Set(byDay[d].map(v => v.who)).size));

  // ── Legend doubles as the person filter ──
  const legend = Object.entries(PEOPLE).map(([k,p]) => {
    const on   = !wkHidden.has(k);
    const acts = [...new Set(WEEK_ACTIVITIES.filter(a => a.who === k)
      .map(a => a.what + (a.until ? ' to ' + wkUntil(a.until) : '')))].join(' · ');
    return `<button class="wk-toggle ${on ? '' : 'is-off'}" onclick="wkToggle('${k}')"
        aria-pressed="${on}" title="${on ? 'Hide' : 'Show'} ${p.name}">
      <span class="wk-swatch" style="${on ? `background:${p.color}` : `box-shadow:inset 0 0 0 2px ${p.color}`}"></span>
      <span class="wk-legend-name" style="${on ? `color:${p.ink}` : ''}">${p.name}</span>
      <span class="wk-legend-sub">${acts || 'nothing scheduled'}</span>
    </button>`;
  }).join('')
  + (wkHidden.size ? `<button class="wk-showall" onclick="wkShowAll()">Show all ${wkHidden.size} hidden</button>` : '');

  // ── Header row ──
  let head = `<div class="wk-corner">PM</div>`;
  WK_DAYS.forEach(d => {
    const m = met[d], t = tier[d], hot = t === WK_TIERS.heaviest;
    const stat = m.count
      ? `${m.count} activit${m.count === 1 ? 'y' : 'ies'} · ${wkT(m.first)}–${wkT(m.last)}`
      : (m.busy.length
          ? `No activities · ${[...new Set(m.busy.map(x => PEOPLE[x.who].name))].join(', ')} busy`
          : 'Nothing scheduled');
    head += `<div class="wk-dayhead ${hot ? 'is-hot' : ''}">
      <div class="wk-dayname">${WK_FULL[d]}</div>
      <div class="wk-load" style="background:${t.bg};color:${t.ink}">
        <span class="wk-load-dot" style="background:${t.dot}"></span>${t.label}
      </div>
      <div class="wk-daystat">${stat}</div>
    </div>`;
  });

  // ── Time axis ──
  let axis = '';
  for (let m = WK_START; m <= WK_END; m += 30) {
    const pct = (m - WK_START) / WK_SPAN * 100;
    if (m % 60 === 0 || m === WK_START)
      axis += `<div class="wk-tick" style="top:${pct.toFixed(3)}%">${wkT(m)}</div>`;
  }

  // ── Day lanes ──
  let lanes = `<div class="wk-axis">${axis}</div>`;
  WK_DAYS.forEach(d => {
    const hot = tier[d] === WK_TIERS.heaviest;
    let cells = '';
    for (let m = WK_START; m <= WK_END; m += 30) {
      const pct = (m - WK_START) / WK_SPAN * 100;
      cells += `<div class="wk-line ${m % 60 === 0 ? 'is-hour' : ''}" style="top:${pct.toFixed(3)}%"></div>`;
    }

    const clashed = new Set();
    met[d].clashes.forEach(c => { clashed.add(c.a); clashed.add(c.b); });

    if (!byDay[d].length) {
      cells += `<div class="wk-free">${wkHidden.size === Object.keys(PEOPLE).length ? 'No one selected' : 'Free'}</div>`;
    } else {
      wkLayout(byDay[d]).forEach(v => {
        const p     = PEOPLE[v.who];
        const top   = (v.s - WK_START) / WK_SPAN * 100;
        const hgt   = (v.e - v.s) / WK_SPAN * 100;
        const width = 100 / (v.lanes * v.subs);
        const left  = (v.lane / v.lanes + v.sub / (v.subs * v.lanes)) * 100;
        const clash = clashed.has(v);
        const busy  = v.kind === 'busy';
        const tip   = `${p.name} · ${busy ? 'Unavailable' : v.what} · ${wkTA(v.s)}–${wkTA(v.e)} (${wkDur(v.e - v.s)})`
                    + (clash ? ` — overlaps another ${p.name} activity` : '');
        // Busy reads as a hatched band so it never looks like somewhere to drive to
        const fill = busy
          ? `background:repeating-linear-gradient(135deg, ${p.bg} 0 7px, #FFFFFF 7px 14px)`
          : `background:${p.bg}`;
        cells += `<div class="wk-ev${clash ? ' is-clash' : ''}${busy ? ' is-busy' : ''}" title="${tip}"
          style="top:calc(${top.toFixed(3)}% + 2px);height:calc(${hgt.toFixed(3)}% - 4px);
                 left:calc(${left.toFixed(3)}% + 3px);width:calc(${width.toFixed(3)}% - 6px);
                 ${fill};border-left-color:${p.color};color:${p.ink};">
          <div class="wk-ev-who">${p.name}${clash ? ' ⚠' : ''}</div>
          <div class="wk-ev-what">${busy ? 'Busy' : v.what}</div>
          <div class="wk-ev-time">${wkT(v.s)}–${wkT(v.e)}</div>
        </div>`;
      });
    }
    lanes += `<div class="wk-lane ${hot ? 'is-hot' : ''}">${cells}</div>`;
  });

  // ── Why these nights are heavy ──
  const ranked = [...WK_DAYS].sort((a,b) => met[b].score - met[a].score);
  const insights = ranked.map(d => {
    const m = met[d], t = tier[d];
    let chips = '';
    // Who is unavailable, and whether that lands on a drop-off/pickup
    const busyChips = m.busy.map(b => {
      const covered = [...new Set(byDay[d].filter(v => v.kind !== 'busy').flatMap(v => [v.s, v.e]))]
        .filter(t => t >= b.s && t <= b.e).length;
      return `<span class="wk-chip">${PEOPLE[b.who].name} unavailable until ${wkTA(b.e)}`
        + (covered ? ` — spans ${covered} drop-off/pickup time${covered === 1 ? '' : 's'}` : '') + `</span>`;
    }).join('');
    if (!m.count) {
      chips = `<span class="wk-chip">No activities${m.busy.length ? '' : ' — an open weeknight'}</span>` + busyChips;
    } else {
      chips += busyChips;
      chips += `<span class="wk-chip">${m.count} activit${m.count === 1 ? 'y' : 'ies'}</span>`;
      chips += `<span class="wk-chip">${wkDur(m.span)} window · ${wkTA(m.first)}–${wkTA(m.last)}</span>`;
      chips += `<span class="wk-chip">${m.stops} drop-off/pickup time${m.stops === 1 ? '' : 's'}</span>`;
      if (m.splitMin) chips += `<span class="wk-chip">${m.maxAt} places at once for ${wkDur(m.splitMin)}</span>`;
      m.clashes.forEach(c => {
        chips += `<span class="wk-chip is-alert">⚠ ${PEOPLE[c.who].name} double-booked ${wkT(c.s)}–${wkTA(c.e)}
          (${c.a.what} vs ${c.b.what})</span>`;
      });
      m.tight.forEach(g => {
        const who  = [...new Set(g.map(p => `${PEOPLE[p.who].name} ${p.kind}`))].join(' + ');
        const a = g[0].t, b = g[g.length-1].t;
        const when = a === b ? `at ${wkTA(a)}` : `${wkT(a)}–${wkTA(b)}`;
        chips += `<span class="wk-chip is-alert">Tight handoff ${when}: ${who}</span>`;
      });
    }
    return `<div class="wk-insight">
      <div class="wk-insight-day">${WK_FULL[d]}</div>
      <div class="wk-insight-body">
        <div class="wk-load" style="background:${t.bg};color:${t.ink};margin-top:0">
          <span class="wk-load-dot" style="background:${t.dot}"></span>${t.label}
        </div>
        <div class="wk-chips">${chips}</div>
      </div>
    </div>`;
  }).join('');

  // ── Table view (every value readable without color) ──
  let rows = '';
  WK_DAYS.forEach(d => {
    if (!byDay[d].length) {
      rows += `<tr class="is-daystart"><td>${WK_FULL[d]}</td>
        <td colspan="4" style="color:var(--muted)">Nothing scheduled</td></tr>`;
      return;
    }
    byDay[d].forEach((v, i) => {
      const p = PEOPLE[v.who];
      rows += `<tr class="${i === 0 ? 'is-daystart' : ''}">
        <td>${i === 0 ? WK_FULL[d] : ''}</td>
        <td><div class="wk-who-cell"><span class="wk-swatch" style="background:${p.color}"></span>${p.name}</div></td>
        <td>${v.what}</td>
        <td class="wk-td-time">${wkTA(v.s)} – ${wkTA(v.e)}</td>
        <td class="wk-td-time">${wkDur(v.e - v.s)}${v.until ? ' · ends ' + wkUntil(v.until) : ''}</td>
      </tr>`;
    });
  });

  document.getElementById('weeklyView').innerHTML = `
    <div class="wk-card">
      <div class="wk-hdr">
        <div>
          <div class="wk-title">Weekly After-School Schedule</div>
          <div class="wk-sub">Monday–Friday · 2:30–9:00 PM · all times PM</div>
        </div>
        <div class="wk-sub">Overlapping activities sit side-by-side · heaviest nights tinted</div>
      </div>
      <div class="wk-legend">${legend}</div>
      <div class="wk-scroll">
        <div class="wk-grid ${maxLanes >= 3 ? 'is-tight' : ''}">
          <div class="wk-row">${head}</div>
          <div class="wk-row">${lanes}</div>
        </div>
      </div>
    </div>

    <div class="wk-card">
      <div class="wk-hdr"><div>
        <div class="wk-title">Where the pressure is</div>
        <div class="wk-sub">Ranked by activities, overlap, and how many handoffs land close together</div>
      </div></div>
      ${insights}
    </div>

    <div class="wk-card">
      <div class="wk-hdr"><div><div class="wk-title">Full list</div></div></div>
      <table class="wk-table">
        <thead><tr><th>Day</th><th>Who</th><th>Activity</th><th>Time</th><th>Length</th></tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>`;
}

// ── Zoom ──────────────────────────────────────────────────
function applyZoom(val) {
  const v = parseInt(val);
  document.querySelectorAll('.cont-day').forEach(el => { el.style.minHeight = v + 'px'; });
  document.querySelectorAll('.cont-day .event-pill, .cont-day .more-count').forEach(el => {
    el.style.display = '';
  });
  const hints = ['Compact','Compact','Normal','Comfortable','Expanded'];
  document.getElementById('zoomHint').textContent = hints[Math.min(4, Math.floor((v - 28) / 20))];
}

// ── View switching ────────────────────────────────────────
function setView(v) {
  view=v;
  ['scroll','overview','summary','weekly'].forEach(k=>{
    document.getElementById('btn'+k.charAt(0).toUpperCase()+k.slice(1)).classList.toggle('active',k===v);
    document.getElementById(k+'View').style.display=k===v?'block':'none';
  });
  document.getElementById('zoomBar').style.display = v==='scroll' ? 'flex' : 'none';
  // The ＋ button adds travel/commitment events — not part of the weekly grid
  document.getElementById('fab').style.display = v==='weekly' ? 'none' : 'flex';
  if (v==='scroll')   { renderScroll(); applyZoom(document.getElementById('zoomSlider').value); }
  if (v==='overview') renderOverview();
  if (v==='summary')  renderSummary();
  if (v==='weekly')   renderWeekly();
}

// ── Type selector ─────────────────────────────────────────
function buildWhoSelect(sel) {
  const el = document.getElementById('evWho');
  el.innerHTML = '<option value="">— anyone / family —</option>' +
    Object.entries(PEOPLE).map(([k, p]) =>
      `<option value="${k}"${sel === k ? ' selected' : ''}>${p.name}</option>`).join('');
}

function buildTypeGrid(sel) {
  selectedType=sel||'travel';
  document.getElementById('typeGrid').innerHTML=Object.entries(TYPES).map(([k,t])=>`
    <button class="type-chip ${selectedType===k?'selected':''}" id="tc-${k}"
      style="${selectedType===k?`background:${t.bg};color:${t.text};border-color:${t.color};`:''}"
      onclick="selectType('${k}')">${t.emoji}<br>${t.label}</button>`).join('');
}

// ── Status (booked / tentative) ───────────────────────────
let selectedStatus = 'booked';

function selectStatus(s) {
  selectedStatus = s;
  const booked    = document.getElementById('statusBooked');
  const tentative = document.getElementById('statusTentative');
  if (s === 'booked') {
    booked.style.border    = '2px solid #FECDD3';
    booked.style.background = '#FFE4E8';
    booked.style.color      = '#9F1239';
    tentative.style.border    = '2px solid var(--border)';
    tentative.style.background = 'white';
    tentative.style.color      = 'var(--muted)';
  } else {
    tentative.style.border    = '2px solid #FDE047';
    tentative.style.background = '#FEF9C3';
    tentative.style.color      = '#854D0E';
    booked.style.border    = '2px solid var(--border)';
    booked.style.background = 'white';
    booked.style.color      = 'var(--muted)';
  }
}

function selectType(k) {
  selectedType=k;
  document.querySelectorAll('.type-chip').forEach(el=>{
    const key=el.id.replace('tc-',''), t=TYPES[key];
    el.classList.toggle('selected',key===k);
    el.style.background=key===k?t.bg:'';
    el.style.color=key===k?t.text:'';
    el.style.borderColor=key===k?t.color:'';
  });
}

// ── Modal ─────────────────────────────────────────────────
function openModal(id=null,date=null) {
  editingId=id;
  const btnDel=document.getElementById('btnDelete');
  if (id) {
    const ev=events.find(e=>e.id===id); if (!ev) return;
    document.getElementById('modalTitle').textContent='Edit Event';
    document.getElementById('evTitle').value=ev.title;
    document.getElementById('evStart').value=ev.start;
    document.getElementById('evEnd').value=ev.end;
    document.getElementById('evNotes').value=ev.notes||'';
    document.getElementById('evTime').value=ev.time||'';
    buildTypeGrid(ev.type); buildWhoSelect(ev.who||''); selectStatus(ev.status||'booked');
    btnDel.style.display='block';
  } else {
    document.getElementById('modalTitle').textContent='Add Event';
    document.getElementById('evTitle').value='';
    document.getElementById('evStart').value=date||'';
    document.getElementById('evEnd').value=date||'';
    document.getElementById('evNotes').value='';
    document.getElementById('evTime').value='';
    buildTypeGrid('game'); buildWhoSelect(''); selectStatus('booked');
    btnDel.style.display='none';
  }
  document.getElementById('overlay').classList.remove('hidden');
  setTimeout(()=>document.getElementById('evTitle').focus(),60);
}

function onStartChange() {
  const start = document.getElementById('evStart').value;
  const endEl = document.getElementById('evEnd');
  endEl.min = start;
  if (!endEl.value || endEl.value < start) endEl.value = start;
  // Focus end date so user can adjust if multi-day
  endEl.focus();
}

function closeModal() { document.getElementById('overlay').classList.add('hidden'); editingId=null; }
function overlayClick(e) { if (e.target===document.getElementById('overlay')) closeModal(); }

function saveEvent() {
  const title=document.getElementById('evTitle').value.trim();
  const start=document.getElementById('evStart').value;
  const end=document.getElementById('evEnd').value;
  const notes=document.getElementById('evNotes').value.trim();
  const time=document.getElementById('evTime').value;
  const who=document.getElementById('evWho').value;
  if (!title)      { alert('Please enter a title.'); return; }
  if (!start||!end){ alert('Please select dates.'); return; }
  if (start>end)   { alert('End must be on or after start.'); return; }
  if (editingId) events=events.map(e=>e.id===editingId?{...e,title,type:selectedType,status:selectedStatus,start,end,time,who,notes}:e);
  else events.push({id:uid(),title,type:selectedType,status:selectedStatus,start,end,time,who,notes});
  persist(); closeModal(); refresh();
}

function deleteEvent() {
  if (!editingId||!confirm('Remove this event?')) return;
  events=events.filter(e=>e.id!==editingId);
  persist(); closeModal(); refresh();
}

function refresh() {
  if (view==='scroll')   { renderScroll(); applyZoom(document.getElementById('zoomSlider').value); }
  if (view==='overview') renderOverview();
  if (view==='summary')  renderSummary();
  if (view==='weekly')   renderWeekly();
}

document.addEventListener('keydown',e=>{ if (e.key==='Escape') closeModal(); });

// ── Init ──────────────────────────────────────────────────
setView('scroll'); // render immediately from localStorage

(async () => {
  // Update from GitHub in the background
  const ghData = await ghLoad().catch(() => null);
  if (ghData && Array.isArray(ghData)) {
    // Prefer GitHub data if it has events, or if local is empty
    if (ghData.length > 0 || events.length === 0) {
      events = ghData;
      localStorage.setItem(STORAGE_KEY, JSON.stringify(events));
      refresh();
    }
    setSyncDot(true);
  } else {
    setSyncDot(false);
  }
  initDone = true; // unlock auto-sync now that we've loaded from GitHub
})();
</script>
</body>
</html>
